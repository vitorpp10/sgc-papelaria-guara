<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGC Papelaria Guará - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .login-card { max-width: 400px; margin-top: 120px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card p-4 shadow login-card w-100">
        <h3 class="text-center mb-2 text-primary fw-bold">Papelaria Guará</h3>
        <p class="text-muted text-center mb-4">Sistema de Gestão Comercial (SGC)</p>
        
        <div id="alertErro" class="alert alert-danger d-none" role="alert"></div>

        <form id="formLogin">
            <div class="mb-3">
                <label for="username" class="form-label font-weight-bold">Usuário</label>
                <input type="text" class="form-control" id="username" required placeholder="Ex: admin">
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" required placeholder="Digite sua senha">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Entrar no Sistema</button>
        </form>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8080";

    document.getElementById("formLogin").addEventListener("submit", async function(event) {
        event.preventDefault(); // Impede a página de recarregar
        
        const username = document.getElementById("username").value;
        const senha = document.getElementById("senha").value;
        const alertErro = document.getElementById("alertErro");
        
        alertErro.classList.add("d-none"); // Reseta o alerta de erro

        try {
            // Envia os dados exatamente como o seu AuthRequestDTO espera
            const response = await fetch(`${API_URL}/auth/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, senha })
            });

            const dados = await response.json();

            if (response.ok) {
                // Guarda o Token e o nome do usuário no navegador
                localStorage.setItem("token_guara", dados.token);
                localStorage.setItem("usuario_guara", username);
                // Vai para a tela principal
                window.location.href = "dashboard.html";
            } else {
                // Mostra o erro retornado pelo seu GlobalExceptionHandler
                alertErro.textContent = dados.erro || "Credenciais inválidas!";
                alertErro.classList.remove("d-none");
            }
        } catch (error) {
            alertErro.textContent = "Erro ao conectar com o backend. Ele está ligado na porta 8080?";
            alertErro.classList.remove("d-none");
        }
    });
</script>
</body>
</html>
